name: CI

on:
  pull_request:
    branches: [main]
  push:
    # A merged PR emits a push to main; direct pushes remain blocked by main protection.
    branches: [working, main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@12.0.0

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

  database:
    name: Local database checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@12.0.0

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npm exec -- supabase start -x studio -x imgproxy -x edge-runtime

      - name: Recreate database from migrations
        run: npm exec -- supabase db reset --no-seed

      - name: Regenerate database types
        run: npm run types:local

      - name: Check generated database types
        run: git diff --exit-code -- src/types/supabase.ts

      - name: Run local integration tests
        shell: bash
        run: |
          eval "$(npm exec -- supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY)"
          export NEXT_PUBLIC_SUPABASE_URL
          export NEXT_PUBLIC_SUPABASE_ANON_KEY
          export SUPABASE_SERVICE_ROLE_KEY
          npm run test:integration

      - name: Stop local Supabase
        if: always()
        run: |
          if [ -x node_modules/.bin/supabase ]; then
            node_modules/.bin/supabase stop --no-backup
          fi

  migrate-hosted-database:
    name: Migrate hosted database
    if: github.event_name == 'push'
    needs: [application, database]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@12.0.0

      - name: Install dependencies
        run: npm ci

      - name: Push pending migrations
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TARGET_DB_URL="$PROD_DB_URL"
          else
            TARGET_DB_URL="$STAGING_DB_URL"
          fi

          if [ -z "${TARGET_DB_URL:-}" ]; then
            echo "ERROR: Missing database URL for ${GITHUB_REF_NAME}"
            exit 1
          fi

          npm exec -- supabase db push --db-url "$TARGET_DB_URL" --yes

  deploy-application:
    name: Deploy application
    if: github.event_name == 'push'
    needs: migrate-hosted-database
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check Vercel configuration
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "ERROR: Missing Vercel deployment configuration"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@12.0.0

      - name: Install Vercel CLI
        run: npm install --global vercel@58.7.1

      - name: Build and deploy application
        id: deploy
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
            vercel build --prod --token "$VERCEL_TOKEN"
            DEPLOYMENT_URL="$(vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN")"
          else
            vercel pull --yes --environment=preview --git-branch=working --token "$VERCEL_TOKEN"
            vercel build --token "$VERCEL_TOKEN"
            DEPLOYMENT_URL="$(vercel deploy --prebuilt --yes --token "$VERCEL_TOKEN")"
          fi
          echo "url=${DEPLOYMENT_URL}" >> "$GITHUB_OUTPUT"
