name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [working]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "26.x"
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@12.0.0

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

  database:
    name: Local database checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "26.x"
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@12.0.0

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npm exec -- supabase start -x studio -x imgproxy -x edge-runtime

      - name: Recreate database from migrations
        run: npm exec -- supabase db reset --no-seed

      - name: Regenerate database types
        run: npm run types:local

      - name: Check generated database types
        run: git diff --exit-code -- src/types/supabase.ts

      - name: Run local integration tests
        shell: bash
        run: |
          eval "$(npm exec -- supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY)"
          npm run test:integration

      - name: Stop local Supabase
        if: always()
        run: |
          if [ -x node_modules/.bin/supabase ]; then
            node_modules/.bin/supabase stop --no-backup
          fi
